[package]
name = "max-inscribed-circle"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Maximum inscribed circle solvers: analytical fast paths, grid refinement, and an exact Voronoi solver over a constrained Delaunay triangulation"
repository = "https://github.com/Wolren/max-inscribed-circle"
documentation = "https://docs.rs/max-inscribed-circle"
readme = "README.md"
keywords = ["gis", "geospatial", "geometry", "voronoi", "inscribed-circle"]
categories = ["science::geo", "algorithms", "mathematics"]

[package.metadata.docs.rs]
features = ["geo-traits"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "max_inscribed_circle"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
geo = "0.33.1"
geo-types = "0.7.19"
thiserror = "2"
rayon = "1.12"
rustc-hash = "2.1.3"
spade = "2.15.1"
libc = "0.2"
geos = { version = "11.1.1", features = ["v3_9_0"], optional = true }
pyo3 = { version = "0.29", optional = true }
geo-traits = { version = "0.3", optional = true }

[features]
default = []
# Comparison only: links the GEOS C library so benchmarks can cross-check the
# native solvers. Never used by the solve pipeline.
bench-geos = ["dep:geos"]
shewchuk = []
python = ["dep:pyo3"]
extension-module = ["pyo3/extension-module"]
geo-traits = ["dep:geo-traits"]

[[example]]
name = "compare_geos"
required-features = ["bench-geos"]
